name: Repost UAMeteo Forecast

on:
  schedule:
    # Перевірка кожні 30 хвилин з 05:00 до 13:00 UTC (07:00–15:00 за Києвом)
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repost-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fix network MTU for Telegram uploads
        run: sudo ip link set dev eth0 mtu 1300 || true

      - name: Check and repost forecast
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python repost_uameteo.py

      - name: Commit updated state
        run: |
          git config user.name "Weather Bot"
          git config user.email "bot@users.noreply.github.com"
          git add repost_state.json
          if ! git diff --staged --quiet; then
            git commit -m "Update repost state"
            git pull --rebase origin main
            git push
          fi
